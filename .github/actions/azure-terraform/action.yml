name: Azure + Terraform (login OIDC e init do estado remoto)
description: Autentica no Azure sem segredos (OIDC), calcula os nomes do estado compartilhado e executa terraform init.
inputs:
  environment:
    description: dev | homolog | prod
    required: true
  bootstrap:
    description: Criar/garantir a conta de estado e backups antes do init
    default: "false"
runs:
  using: composite
  steps:
    - name: Nomes do estado compartilhado
      shell: bash
      run: |
        sub_hash="$(printf '%s' "${ARM_SUBSCRIPTION_ID}" | sha1sum | cut -c1-8)"
        {
          echo "SHARED_RG=rg-kubeshop-shared"
          echo "STATE_SA=stkubeshop${sub_hash}"
          echo "LOCATION=brazilsouth"
          echo "TF_VAR_environment=${{ inputs.environment }}"
          echo "TF_VAR_backup_resource_group=rg-kubeshop-shared"
          echo "TF_VAR_backup_storage_account=stkubeshop${sub_hash}"
        } >> "$GITHUB_ENV"

    - name: Login no Azure (OIDC, sem senha)
      uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    - name: Bootstrap do estado remoto e dos backups
      if: inputs.bootstrap == 'true'
      shell: bash
      run: bash scripts/bootstrap-state.sh

    - name: Instalar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false

    - name: terraform init (estado em Azure Storage)
      shell: bash
      working-directory: terraform
      run: |
        terraform init -input=false \
          -backend-config="resource_group_name=${SHARED_RG}" \
          -backend-config="storage_account_name=${STATE_SA}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=${{ inputs.environment }}.tfstate"
