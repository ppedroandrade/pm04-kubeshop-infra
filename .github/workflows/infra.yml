name: "Infra: provisionar e configurar"
run-name: "${{ inputs.operation }} · ${{ inputs.environment }} · app ${{ inputs.docker_tag }} · por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "plan = só mostra o que mudaria | apply = Terraform + Ansible"
        type: choice
        options: [apply, plan]
        default: apply
      environment:
        description: Ambiente de destino
        type: choice
        options: [dev, homolog, prod]
        default: dev
      instance_name:
        description: "Prefixo das VMs (vm-<prefixo>-app-<env>). Mudar o nome RECRIA as VMs"
        type: string
        default: kubeshop
      app_vm_size:
        description: "instance_type da VM da aplicação (Nginx + API)"
        type: choice
        options: [Standard_D2s_v4, Standard_E2s_v4, Standard_D2_v4]
        default: Standard_D2s_v4
      db_vm_size:
        description: "instance_type da VM do MongoDB"
        type: choice
        options: [Standard_D2s_v4, Standard_E2s_v4, Standard_D2_v4]
        default: Standard_D2s_v4
      docker_image:
        description: "Prefixo das imagens (vazio = ghcr.io/<dono>/kubeshop -> -api / -frontend)"
        type: string
        default: ""
      docker_tag:
        description: "docker_tag da aplicação (publicada pelo workflow App images)"
        type: string
        default: "1.0.0"
      mongo_tag:
        description: Tag da imagem oficial do MongoDB
        type: string
        default: "8.0.17"
      update_os:
        description: Aplicar atualizações do sistema operacional
        type: boolean
        default: false
      extra_packages:
        description: "Pacotes adicionais separados por vírgula"
        type: string
        default: "curl,git,unzip"

permissions:
  id-token: write   # OIDC com o Azure
  contents: read
  packages: read    # pull das imagens privadas do GHCR

concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VAR_instance_name: ${{ inputs.instance_name }}
  TF_VAR_app_vm_size: ${{ inputs.app_vm_size }}
  TF_VAR_db_vm_size: ${{ inputs.db_vm_size }}
  # Região das VMs (variável do repositório; padrão brazilsouth). Trocar recria o ambiente.
  TF_VAR_location: ${{ vars.AZURE_LOCATION || 'brazilsouth' }}

jobs:
  terraform:
    name: Terraform (validar, planejar, aplicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Parâmetros recebidos
        run: |
          {
            echo "### Parâmetros"
            echo "| parâmetro | valor |"
            echo "|---|---|"
            echo "| operation | ${{ inputs.operation }} |"
            echo "| environment | ${{ inputs.environment }} |"
            echo "| instance_name | ${{ inputs.instance_name }} |"
            echo "| app_vm_size | ${{ inputs.app_vm_size }} |"
            echo "| db_vm_size | ${{ inputs.db_vm_size }} |"
            echo "| docker_image | ${{ inputs.docker_image || 'ghcr.io/<dono>/kubeshop' }} |"
            echo "| docker_tag | ${{ inputs.docker_tag }} |"
            echo "| mongo_tag | ${{ inputs.mongo_tag }} |"
            echo "| update_os | ${{ inputs.update_os }} |"
            echo "| extra_packages | ${{ inputs.extra_packages }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure + terraform init
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}
          bootstrap: "true"

      - name: terraform fmt e validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive -diff
          terraform validate -no-color

      - name: terraform plan
        id: plan
        working-directory: terraform
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 1 ]; then echo "::error::terraform plan falhou"; exit 1; fi
          if [ "$code" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^(Plan:|No changes\.|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        if: inputs.operation == 'apply' && steps.plan.outputs.changes == 'true'
        working-directory: terraform
        run: terraform apply -no-color -input=false tfplan

      - name: Sem alterações de infraestrutura
        if: steps.plan.outputs.changes == 'false'
        run: echo "Terraform não encontrou alterações (estado == código). Nada a aplicar." | tee -a "$GITHUB_STEP_SUMMARY"

  ansible:
    name: Ansible (SO, pacotes, Docker, contêineres)
    needs: terraform
    if: inputs.operation == 'apply'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Azure + terraform init
        uses: ./.github/actions/azure-terraform
        with:
          environment: ${{ inputs.environment }}

      - name: Outputs do Terraform -> inventário do Ansible
        run: |
          terraform -chdir=terraform output -json > "$RUNNER_TEMP/tf.json"
          bash scripts/render-inventory.sh "$RUNNER_TEMP/tf.json"

      - name: Instalar Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "ansible>=11,<12" && ansible --version | head -1

      - name: Liberar SSH temporário para este runner
        run: bash scripts/ssh-access.sh open

      - name: ansible-playbook
        working-directory: ansible
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          P_ENV: ${{ inputs.environment }}
          P_IMAGE: ${{ inputs.docker_image }}
          P_TAG: ${{ inputs.docker_tag }}
          P_MONGO: ${{ inputs.mongo_tag }}
          P_UPDATE: ${{ inputs.update_os }}
          P_PKGS: ${{ inputs.extra_packages }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="${P_IMAGE:-ghcr.io/${owner}/kubeshop}"
          pkgs="$(printf '%s' "$P_PKGS" | tr -d ' ' | jq -R -c 'split(",") | map(select(length>0))')"
          jq -n \
            --arg env "$P_ENV" --arg image "$image" --arg tag "$P_TAG" --arg mongo "$P_MONGO" \
            --argjson update "$P_UPDATE" --argjson pkgs "$pkgs" \
            --arg ruser "$REGISTRY_USER" --arg rtoken "$REGISTRY_TOKEN" \
            '{environment_name:$env, docker_image:$image, docker_tag:$tag, mongo_tag:$mongo,
              update_os:$update, extra_packages:$pkgs, registry_username:$ruser, registry_token:$rtoken}' \
            > "$RUNNER_TEMP/kubeshop/params.json"
          chmod 600 "$RUNNER_TEMP/kubeshop/params.json"
          set -o pipefail
          ansible-playbook -i "$INVENTORY" playbook.yml \
            -e "@$TF_VARS_FILE" -e "@$RUNNER_TEMP/kubeshop/params.json" | tee "$RUNNER_TEMP/ansible.log"
          {
            echo "### Ansible PLAY RECAP"
            echo '```'
            sed -n '/PLAY RECAP/,$p' "$RUNNER_TEMP/ansible.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validação externa (loja pública, banco isolado)
        run: |
          curl -fsS --retry 5 --retry-delay 5 "http://${APP_FQDN}/api/health/ready"; echo
          curl -fsS "http://${APP_FQDN}/api/info"; echo
          if curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "https://${APP_FQDN}/healthz"; then
            https_status="OK (certificado válido)"
          else
            https_status="ainda sem certificado; loja disponível por HTTP"
            echo "::warning::HTTPS ainda não respondeu com certificado válido em https://${APP_FQDN}/"
          fi
          echo "HTTPS: ${https_status}"
          if nc -z -w 5 "${APP_PUBLIC_IP}" 27017; then
            echo "::error::Porta 27017 respondeu pela internet!"; exit 1
          fi
          echo "OK: 27017 não aceita conexões públicas (o banco não tem IP público e o NSG só libera a sub-rede da aplicação)"
          {
            echo "### Ambiente ${{ inputs.environment }}"
            echo "- Loja (HTTPS): https://${APP_FQDN}/ (${https_status})"
            echo "- Loja (HTTP): http://${APP_FQDN}/ · IP ${APP_PUBLIC_IP}"
            echo "- MongoDB: sem IP público; porta 27017 fechada para a internet"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fechar SSH temporário
        if: always()
        run: |
          if [ -n "${RESOURCE_GROUP:-}" ]; then bash scripts/ssh-access.sh close; fi
          rm -f ~/.ssh/kubeshop_admin
