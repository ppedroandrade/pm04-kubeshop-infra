---
- name: Verificar se o Docker já está instalado
  ansible.builtin.command: docker --version
  register: docker_present
  changed_when: false
  failed_when: false

- name: Criar diretório de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar a chave GPG oficial do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configurar o repositório oficial do Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: |
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
  register: docker_repo

- name: Atualizar o índice após adicionar o repositório
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 600
  when: docker_repo.changed

- name: Instalar Docker Engine e plugin Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: 600

- name: Configurar rotação de logs do Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }
  notify: Reiniciar Docker

- name: Garantir Docker habilitado e em execução
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Aplicar handlers pendentes antes de subir contêineres
  ansible.builtin.meta: flush_handlers
