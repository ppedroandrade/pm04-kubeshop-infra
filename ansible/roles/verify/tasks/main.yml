---
# Verificações somente leitura (não alteram estado -> changed=0 no recap).
- name: Estado dos contêineres da aplicação
  ansible.builtin.command: docker compose -f {{ kubeshop_root }}/app/compose.yaml ps --format "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}"
  register: app_ps
  changed_when: false

- name: Mostrar contêineres
  ansible.builtin.debug:
    var: app_ps.stdout_lines

- name: Nginx responde (/healthz)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port }}/healthz"
    status_code: 200
  register: healthz
  retries: 10
  delay: 6
  until: healthz.status == 200

- name: API pronta e conectada ao MongoDB (/api/health/ready)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port }}/api/health/ready"
    status_code: 200
    return_content: true
  register: ready
  retries: 20
  delay: 6
  until: ready.status == 200

- name: Versão publicada (/api/info)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port }}/api/info"
    return_content: true
  register: info

- name: Mostrar versão
  ansible.builtin.debug:
    msg: "{{ info.json | default(info.content) }}"

- name: Teste funcional do repositório (catálogo + pedido fictício)
  ansible.builtin.command: docker exec kubeshop-api node /app/scripts/smoke.mjs http://frontend:8080
  register: smoke
  changed_when: false
  when: run_smoke_test | bool

- name: Resultado do teste funcional
  ansible.builtin.debug:
    var: smoke.stdout
  when: run_smoke_test | bool

- name: HTTPS público com certificado válido (não bloqueia o deploy)
  ansible.builtin.uri:
    url: "https://{{ app_fqdn }}/healthz"
    validate_certs: true
    status_code: 200
  register: https_check
  retries: 12
  delay: 10
  until: https_check.status == 200
  failed_when: false
  ignore_errors: true
  delegate_to: localhost
  become: false
  when: app_fqdn | length > 0

- name: Resultado do HTTPS
  ansible.builtin.debug:
    msg: >-
      {{ 'HTTPS OK: https://' ~ app_fqdn ~ '/' if (https_check.status | default(0)) == 200
         else 'HTTPS ainda sem certificado (a loja segue disponível por HTTP). Veja: docker logs kubeshop-caddy' }}
  when: app_fqdn | length > 0

- name: Painel /admin · sem login redireciona para a tela de login
  ansible.builtin.uri:
    url: "https://{{ app_fqdn }}/admin/"
    follow_redirects: none
    status_code: 303
  register: admin_noauth
  failed_when: admin_noauth.status != 303 or '/admin/login' not in (admin_noauth.location | default(''))
  delegate_to: localhost
  become: false
  when: admin_enabled | bool and app_fqdn | length > 0

- name: Painel /admin · API sem sessão é recusada (401)
  ansible.builtin.uri:
    url: "https://{{ app_fqdn }}/admin/api/run"
    method: POST
    headers: { X-KubeShop-Admin: "1" }
    body_format: json
    body: { target: app, cmd: health }
    status_code: 401
  delegate_to: localhost
  become: false
  when: admin_enabled | bool and app_fqdn | length > 0

- name: Painel /admin · login com a senha do GitHub Secrets
  ansible.builtin.uri:
    url: "https://{{ app_fqdn }}/admin/login"
    method: POST
    body_format: form-urlencoded
    body: { usuario: "{{ admin_user }}", senha: "{{ admin_password }}" }
    follow_redirects: none
    status_code: 303
  register: admin_login
  delegate_to: localhost
  become: false
  no_log: true
  when: admin_enabled | bool and app_fqdn | length > 0

- name: Painel /admin · com sessão executa as rotinas (app e banco)
  ansible.builtin.uri:
    url: "https://{{ app_fqdn }}/admin/api/run"
    method: POST
    headers:
      X-KubeShop-Admin: "1"
      Cookie: "{{ admin_login.cookies_string }}"
    body_format: json
    body: "{{ item }}"
    return_content: true
    timeout: 120
  register: admin_checks
  failed_when: false
  loop:
    - { target: app, cmd: health }
    - { target: db, cmd: health }
    - { target: db, cmd: list-backups }
  loop_control:
    label: "{{ item.target }}:{{ item.cmd }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: admin_enabled | bool and app_fqdn | length > 0

- name: Painel /admin · conferir resultado das rotinas
  ansible.builtin.assert:
    that: item.json.ok | default(false)
    fail_msg: "{{ item.item.target }}:{{ item.item.cmd }} -> HTTP {{ item.status }} {{ (item.json | default({})).error | default('') }} {{ ((item.json | default({})).output | default(''))[:300] }} {{ item.msg | default('') }}"
    success_msg: "{{ item.item.target }}:{{ item.item.cmd }} OK"
  loop: "{{ admin_checks.results }}"
  loop_control:
    label: "{{ item.item.target }}:{{ item.item.cmd }}"
  when: admin_enabled | bool and app_fqdn | length > 0

- name: Painel /admin · encerrar a sessão de teste
  ansible.builtin.uri:
    url: "https://{{ app_fqdn }}/admin/logout"
    headers: { Cookie: "{{ admin_login.cookies_string }}" }
    follow_redirects: none
    status_code: 303
  delegate_to: localhost
  become: false
  no_log: true
  when: admin_enabled | bool and app_fqdn | length > 0

- name: Painel /admin · resultado
  ansible.builtin.debug:
    msg: "Painel OK: login, {{ admin_checks.results | map(attribute='item') | map(attribute='cmd') | list }} via SSH restrito, logout"
  when: admin_enabled | bool and app_fqdn | length > 0
