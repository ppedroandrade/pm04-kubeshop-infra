---
- name: Validar parâmetros da aplicação
  ansible.builtin.assert:
    that:
      - docker_image | length > 0
      - docker_tag | length > 0
      - mongo_app_password | length >= 16
    quiet: true
  no_log: true

- name: Diretórios do projeto da aplicação
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kubeshop_root }}/app", owner: root, mode: "0755" }
    - { path: "{{ kubeshop_root }}/app/secrets", owner: "1000", mode: "0700" }
    - { path: "{{ kubeshop_root }}/app/admin", owner: root, mode: "0755" }

- name: Senha do usuário da aplicação no MongoDB (uid 1000 = usuário node da imagem)
  ansible.builtin.copy:
    dest: "{{ kubeshop_root }}/app/secrets/mongo-app-password"
    content: "{{ mongo_app_password }}"
    owner: "1000"
    group: "1000"
    mode: "0400"
  no_log: true

- name: Painel /admin · arquivos do serviço
  ansible.builtin.copy:
    src: "admin/{{ item }}"
    dest: "{{ kubeshop_root }}/app/admin/"
    mode: "0644"
  loop: [Dockerfile, app.py, index.html, login.html]
  when: admin_enabled | bool

- name: Painel /admin · versão da imagem (hash dos arquivos)
  ansible.builtin.set_fact:
    admin_build_hash: "{{ (lookup('file', 'admin/Dockerfile') ~ lookup('file', 'admin/app.py') ~ lookup('file', 'admin/index.html') ~ lookup('file', 'admin/login.html')) | hash('sha1') | truncate(12, True, '') }}"

- name: Painel /admin · hash PBKDF2-SHA256 da senha (sal fixo derivado da senha = idempotente)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, hashlib, os, sys
        p = os.environ["P"].encode()
        salt = hashlib.sha256(b"kubeshop-admin:" + p).digest()[:16]
        h = hashlib.pbkdf2_hmac("sha256", p, salt, 310000)
        print("pbkdf2_sha256$310000$" + base64.b64encode(salt).decode() + "$" + base64.b64encode(h).decode())
  environment:
    P: "{{ admin_password }}"
  delegate_to: localhost
  become: false
  register: admin_hash_cmd
  changed_when: false
  no_log: true
  when: admin_enabled | bool

- name: Painel /admin · gravar o hash da senha (lido só pelo usuário do contêiner)
  ansible.builtin.copy:
    dest: "{{ kubeshop_root }}/app/secrets/admin-password-hash"
    content: "{{ admin_hash_cmd.stdout }}\n"
    owner: "10001"
    group: "10001"
    mode: "0400"
  no_log: true
  when: admin_enabled | bool

- name: Painel /admin · chave SSH restrita (lida só pelo usuário do contêiner)
  ansible.builtin.copy:
    dest: "{{ kubeshop_root }}/app/secrets/admin-ssh-key"
    content: "{{ admin_panel_private_key }}\n"
    owner: "10001"
    group: "10001"
    mode: "0400"
  no_log: true
  when: admin_enabled | bool

- name: Hash da configuração do Caddy (recria o contêiner quando o Caddyfile muda)
  ansible.builtin.set_fact:
    caddyfile_hash: "{{ lookup('ansible.builtin.template', 'Caddyfile.j2') | hash('sha1') | truncate(12, True, '') }}"
  no_log: true

- name: Arquivo Compose da aplicação
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ kubeshop_root }}/app/compose.yaml"
    mode: "0644"

- name: Configuração do Caddy (HTTP + HTTPS automático)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ kubeshop_root }}/app/Caddyfile"
    mode: "0644"
  register: caddyfile

- name: Testar conectividade privada com o MongoDB antes do deploy
  ansible.builtin.wait_for:
    host: "{{ db_private_ip }}"
    port: 27017
    timeout: 120

- name: Deploy com credencial temporária do registro
  block:
    - name: Login temporário no registro de imagens
      ansible.builtin.shell: |
        set -o pipefail
        printf '%s' "$REGISTRY_TOKEN" | docker login {{ registry_host }} -u "$REGISTRY_USER" --password-stdin
      args:
        executable: /bin/bash
      environment:
        REGISTRY_TOKEN: "{{ registry_token }}"
        REGISTRY_USER: "{{ registry_username }}"
      when: registry_token | length > 0
      changed_when: false
      no_log: true

    - name: Subir/atualizar frontend e API (recria só o que mudou)
      community.docker.docker_compose_v2:
        project_src: "{{ kubeshop_root }}/app"
        state: present
        pull: "{{ docker_pull_policy }}"
        build: policy
        remove_orphans: true
        wait: true
        wait_timeout: 300
      register: app_compose

  always:
    - name: Remover a credencial do registro da VM
      ansible.builtin.command: docker logout {{ registry_host }}
      when: registry_token | length > 0
      changed_when: false

- name: Resultado do deploy
  ansible.builtin.debug:
    msg: "Aplicação {{ docker_image }}-{api,frontend}:{{ docker_tag }} (changed={{ app_compose.changed }})"

- name: Remover imagens antigas sem uso
  ansible.builtin.command: docker image prune -f --filter "until=24h"
  register: prune
  changed_when: "'Total reclaimed space: 0B' not in prune.stdout"
  when: app_compose.changed
