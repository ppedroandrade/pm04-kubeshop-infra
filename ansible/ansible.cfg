[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
